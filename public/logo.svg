<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Crisp rendering without anti-aliasing seam artifacts -->
    <style>
      .logo-navy { fill: #002166; }
      .logo-white { fill: #ffffff; }
    </style>
  </defs>

  <!-- Clean white background (for stand-alone rendering or transparent when needed) -->
  <rect width="1000" height="1000" fill="#ffffff" rx="160" />

  <g id="le-ngoc-long-monogram">
    <!-- 1. The Left Vertical Stem: starts high at y=78 (ascender) down to y=922, x: 88 to 172 -->
    <!-- 2. The Big Outer Arch: apex at y=110, curves around to right (x=936, y=516), down to base (y=922) -->
    <!-- 3. The Flat Base: y=922 from x=88 to x=526 -->
    <!-- 4. Inner Circle: Center (526, 516), R=342 -->
    <path class="logo-navy" fill-rule="evenodd" d="
      M 88 78
      L 172 78
      L 172 268
      C 236 168, 370 110, 526 110
      C 750 110, 936 292, 936 516
      C 936 740, 750 922, 526 922
      L 88 922
      Z

      M 526 194
      C 348 194, 204 338, 204 516
      C 204 694, 348 838, 526 838
      C 704 838, 848 694, 848 516
      C 848 338, 704 194, 526 194
      Z
    " />

    <!-- Center Hook (G / L geometric element): horizontal bar (y: 500-576) + vertical stem (x: 432-516, y: 500-922) -->
    <path class="logo-navy" d="
      M 308 500
      L 516 500
      L 516 922
      L 432 922
      L 432 576
      L 308 576
      Z
    " />

    <!-- Bottom-Left N-Block: triangle / polygon between stem and inner bar -->
    <path class="logo-navy" d="
      M 172 500
      L 432 768
      L 432 922
      L 172 922
      Z
    " />

    <!-- Negative Space Cutouts forming the 'N' ribbons: -->
    <!-- Cutout 1: Corner triangle cutout -->
    <path class="logo-white" d="
      M 172 846
      L 172 922
      L 272 922
      Z
    " />

    <!-- Cutout 2: Lower curved diagonal slit -->
    <path class="logo-white" d="
      M 204 658
      C 220 682, 274 756, 362 822
      C 368 827, 362 836, 348 834
      C 268 768, 212 698, 194 666
      C 190 660, 198 654, 204 658
      Z
    " />

    <!-- Cutout 3: Upper parallel diagonal slit -->
    <path class="logo-white" d="
      M 252 588
      C 272 616, 340 706, 422 780
      L 432 780
      L 432 766
      C 346 678, 282 594, 258 574
      C 252 568, 246 578, 252 588
      Z
    " />
  </g>
</svg>